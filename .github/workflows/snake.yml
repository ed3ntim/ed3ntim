name: contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ed3ntim
          outputs: |
            github-snake.svg?palette=github-light&color_snake=#52525b&color_dots=#ebedf0,#d4d4d8,#a1a1aa,#71717a,#3f3f46
            github-snake-dark.svg?palette=github-dark&color_snake=#e4e4e7&color_dots=#161b22,#3f3f46,#52525b,#a1a1aa,#e4e4e7
      - name: commit snake
        run: |
          git config user.name "ed3n"
          git config user.email "115729769+ed3ntim@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update contribution snake"
          git push
